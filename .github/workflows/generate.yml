name: Auto Generate Website Showcase Data

on:
  push:
    paths:
      - 'urls.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/github-script@v7
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Generate Site Data
        run: npm run build-data

      - name: Commit and Push Generated Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git status
          git diff-index --quiet HEAD || git commit -m "auto: update site metadata and screenshots"
          git push
